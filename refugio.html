<body class="scene-page">

      </div>
    </div>

  <main id="contenido">
    <section class="scene" aria-label="Interior del refugio">
      <div class="scene__viewport" id="scene-viewport">
        <svg class="scene__art" id="scene-art" viewBox="0 0 1024 559" preserveAspectRatio="xMidYMid slice" style="--scene-ratio: 1.832">
          <defs>
            <linearGradient id="scene-spot-fade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="black" />
              <stop offset="0.6" stop-color="black" />
              <stop offset="1" stop-color="white" />
            </linearGradient>
            <mask id="scene-spot-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="559">
              <rect x="0" y="0" width="1024" height="559" fill="white" />
              <polygon id="scene-spot-hole" points="" fill="black" />
            </mask>
          </defs>
          <image class="scene__image" href="assets/img/interior-refugio.webp" x="0" y="0" width="1024" height="559" aria-hidden="true" />
          <rect class="scene__dim" x="0" y="0" width="1024" height="559" mask="url(#scene-spot-mask)" aria-hidden="true" />
          <g id="scene-hotspots">
            <!-- Generado por js/refugio.js: material de escalada (habilidades) y diario de montaña -->
          </g>
          <g class="tag" id="scene-tag" aria-hidden="true">
            <line class="tag__string" id="scene-tag-string" />
            <rect class="tag__bg" id="scene-tag-bg" rx="3" />
            <circle class="tag__hole" id="scene-tag-hole" r="2.5" />
            <text id="scene-tag-text"></text>
          </g>
        </svg>
      </div>

      <h1 class="sr-only">Refugio de Pablo José Cortés Santos</h1>
    </section>
  </main>

  <footer class="site-footer">

    </div>
  </footer>

  <script>
    document.getElementById("current-year").textContent = String(new Date().getFullYear());
  </script>
  <script type="module" src="js/refugio.js"></script>
  <script type="module" src="js/analytics.js"></script>
